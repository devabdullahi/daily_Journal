name: EngineBench
options:
  bundleIdPrefix: com.abdul.spike
targets:
  EngineBench:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: EngineBench
        excludes: ["Plans"]
      - path: EngineBench/Plans
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.abdul.spike.enginebench
        DEVELOPMENT_TEAM: 5FVTJZXNS5
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "6.0"
        SWIFT_OBJC_BRIDGING_HEADER: EngineBench/Bridging.h
        LIBRARY_SEARCH_PATHS: /Users/abdul/Library/Caches/dj-target/aarch64-apple-ios/release
        OTHER_LDFLAGS: ["-leasel_ios", "-lc++"]
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        DEAD_CODE_STRIPPING: YES
